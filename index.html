<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repository Browser</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.5;
      background: #f8f9fa;
      color: #222;
    }

    h1 {
      margin-bottom: 0.2em;
    }

    .path {
      color: #666;
      margin-bottom: 2em;
    }

    ul {
      list-style-type: none;
      padding-left: 1.2em;
    }

    li {
      margin: 0.3em 0;
    }

    .folder {
      font-weight: bold;
      margin-top: 0.8em;
    }

    a {
      text-decoration: none;
      color: #0066cc;
    }

    a:hover {
      text-decoration: underline;
    }

    .html-link {
      color: #008000;
    }

    .other-file {
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Repository Browser</h1>
  <div class="path">GitHub Pages view of lpihlstrom/projects</div>

  <div id="content">Loading repository contents...</div>

  <script>
    const username = "lpihlstrom";
    const repo = "projects";

    async function fetchContents(path = "") {
      const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`GitHub API error: ${response.status}`);
      }

      return await response.json();
    }

    function githubPagesUrl(path) {
      return `https://${username}.github.io/${repo}/${path}`;
    }

</html>
